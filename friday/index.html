<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>FRIDAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--c:#5fdcff;--c2:#9ff0ff;--dim:rgba(150,215,240,.55);--amber:#ffb547;--bg:#02060b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{-webkit-touch-callout:none;margin:0;height:100%;background:radial-gradient(ellipse at 50% 42%,#071a26 0%,#03080f 55%,#010306 100%);color:var(--c2);font-family:Rajdhani,"Share Tech Mono",-apple-system,sans-serif;overflow:hidden}
  #orb{position:fixed;inset:0;width:100%;height:100%;display:block}
  .scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(120,220,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
  .vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
  .hud{position:fixed;font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;pointer-events:none;line-height:1.7}
  #tl{top:calc(20px + env(safe-area-inset-top));left:22px}
  #tr{top:calc(20px + env(safe-area-inset-top));right:22px;text-align:right}
  #bl{bottom:calc(22px + env(safe-area-inset-bottom));left:22px}
  #br{bottom:calc(22px + env(safe-area-inset-bottom));right:22px;text-align:right}
  .hud b{color:var(--c);font-weight:400}
  .corner{position:fixed;width:26px;height:26px;border-color:rgba(95,220,255,.35);border-style:solid;pointer-events:none}
  .c1{top:calc(10px + env(safe-area-inset-top));left:10px;border-width:1px 0 0 1px}.c2{top:calc(10px + env(safe-area-inset-top));right:10px;border-width:1px 1px 0 0}
  .c3{bottom:calc(10px + env(safe-area-inset-bottom));left:10px;border-width:0 0 1px 1px}.c4{bottom:calc(10px + env(safe-area-inset-bottom));right:10px;border-width:0 1px 1px 0}
  #title{position:fixed;left:0;right:0;top:calc(19% - 10px);text-align:center;pointer-events:none;font-weight:300;font-size:13px;letter-spacing:.9em;padding-left:.9em;color:var(--c);text-shadow:0 0 12px rgba(95,220,255,.6)}
  #status{position:fixed;left:0;right:0;top:calc(19% + 12px);text-align:center;font-family:"Share Tech Mono",monospace;font-size:10px;letter-spacing:.4em;padding-left:.4em;color:var(--dim);text-transform:uppercase;pointer-events:none}
  #caption{position:fixed;left:0;right:0;bottom:calc(128px + env(safe-area-inset-bottom));text-align:center;padding:0 34px;pointer-events:none}
  #heard{font-family:"Share Tech Mono",monospace;font-size:12px;letter-spacing:.08em;color:var(--dim);min-height:18px;transition:opacity .9s}
  #heard:not(:empty)::before{content:"› ";color:var(--amber)}
  #said{font-size:22px;font-weight:400;line-height:1.3;margin:10px auto 0;min-height:30px;transition:opacity .9s;max-width:680px;color:#e6fbff;text-shadow:0 0 18px rgba(95,220,255,.35)}
  #end{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom));width:54px;height:54px;margin-left:-27px;border-radius:50%;border:1px solid rgba(255,140,120,.45);box-shadow:0 0 18px rgba(255,90,70,.15) inset;background:transparent;display:none}
  #end::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:2px;background:rgba(255,120,100,.9);box-shadow:0 0 10px rgba(255,90,70,.8)}
  #end.on{display:block}
  #tap{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));text-align:center;font-family:"Share Tech Mono",monospace;color:var(--dim);font-size:11px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;pointer-events:none;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .sheet{position:fixed;inset:0;background:rgba(1,5,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:10;user-select:text;-webkit-user-select:text}
  .sheet.on{display:flex}
  .card{position:relative;width:min(430px,92vw);padding:30px 26px 24px;background:linear-gradient(180deg,rgba(10,34,48,.72),rgba(4,14,22,.8));border:1px solid rgba(95,220,255,.28);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);box-shadow:0 0 40px rgba(95,220,255,.08) inset}
  .card h1{font-weight:300;font-size:24px;letter-spacing:.6em;margin:0 0 4px;color:var(--c);text-shadow:0 0 14px rgba(95,220,255,.5)}
  .card p{font-family:"Share Tech Mono",monospace;color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;line-height:1.6;margin:0 0 14px}
  label{display:block;font-family:"Share Tech Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;margin:16px 0 6px}
  input,select{width:100%;padding:12px 14px;font-size:16px;font-family:Rajdhani,sans-serif;border:1px solid rgba(95,220,255,.25);border-radius:0;background:rgba(0,10,16,.6);color:#e6fbff;outline:none;user-select:text;-webkit-user-select:text;-webkit-appearance:none}
  input:focus,select:focus{border-color:var(--c);box-shadow:0 0 12px rgba(95,220,255,.25)}
  .row{display:flex;gap:10px;margin-top:22px}
  button{flex:1;padding:12px;font-family:"Share Tech Mono",monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;border:1px solid var(--c);border-radius:0;background:rgba(95,220,255,.14);color:#e6fbff}
  button.ghost{border-color:rgba(95,220,255,.25);background:transparent;color:var(--dim)}
  .small{font-family:"Share Tech Mono",monospace;font-size:10px;letter-spacing:.1em;color:var(--dim);margin-top:16px;line-height:1.6}
  #notice{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(520px,90vw);padding:12px 16px;border:1px solid rgba(255,181,71,.5);background:rgba(30,18,4,.85);color:var(--amber);font-family:"Share Tech Mono",monospace;font-size:12px;letter-spacing:.06em;line-height:1.5;display:none;z-index:5;user-select:text;-webkit-user-select:text}
  #notice a{color:#fff}
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div class="scan"></div><div class="vig"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
<div class="hud" id="tl">F.R.I.D.A.Y. <b>v2.1</b><br><span id="h-clock">--:--</span><br><span id="h-date"></span></div>
<div class="hud" id="tr">Link <b id="h-link">Standby</b><br>Voice <b id="h-voice">--</b><br>Latency <b id="h-lat">--</b></div>
<div class="hud" id="bl">Mem <b id="h-mem">0</b><br>Notes <b id="h-notes">0</b></div>
<div class="hud" id="br">Harrisburg PA<br><b>40.27N 76.88W</b></div>
<div id="title">FRIDAY</div>
<div id="status">Standby</div>
<div id="notice"></div>
<div id="caption"><div id="heard"></div><div id="said"></div></div>
<div id="tap">Tap to initialize</div>
<div id="end" title="End"></div>

<div class="sheet" id="setup"><div class="card">
  <h1>FRIDAY</h1>
  <p>Your voice, a real conversation. Talk naturally and cut in any time.</p>
  <label>What should I call you?</label>
  <input id="f-name" placeholder="Pastor" autocomplete="off">
  <label>Groq API key</label>
  <input id="f-key" type="password" placeholder="gsk_..." autocomplete="off">
  <label>Voice</label>
  <select id="f-voice">
    <option value="diana">Diana (warm, female)</option>
    <option value="autumn">Autumn (bright, female)</option>
    <option value="hannah">Hannah (soft, female)</option>
    <option value="daniel">Daniel (calm, male)</option>
    <option value="troy">Troy (easy, male)</option>
    <option value="austin">Austin (upbeat, male)</option>
  </select>
  <div class="row"><button class="ghost" id="f-preview">Preview</button><button id="f-save">Save</button></div>
  <div class="row" id="f-extra" style="display:none"><button class="ghost" id="f-forget">Clear memory</button><button class="ghost" id="f-close">Close</button></div>
  <div class="small">Your key stays on this device. Long-press the orb anytime to come back here.</div>
</div></div>

<script>
"use strict";
const API = "https://api.groq.com/openai/v1";
const LLM = "openai/gpt-oss-120b";
const STT = "whisper-large-v3-turbo";
const TTS = "canopylabs/orpheus-v1-english";
const $ = id => document.getElementById(id);

// ---------- settings & memory ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem("friday."+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ localStorage.setItem("friday."+k, JSON.stringify(v)); }
};
let cfg = store.get("cfg", {name:"", key:"", voice:"diana"});
let history = store.get("history", []);       // [{role, content}]
let notes = store.get("notes", []);
let reminders = store.get("reminders", []);   // [{id, at, text, done}]
function saveHistory(){ history = history.slice(-40); store.set("history", history); }

// ---------- UI ----------
const ui = {
  state:"asleep",
  set(s){ this.state = s; $("status").textContent = ({asleep:"Standby", idle:"Online · listening", listening:"Receiving", thinking:"Processing", speaking:"Speaking"})[s] || s; if (s==="speaking" && this.t0){ $("h-lat").textContent = Math.round(performance.now()-this.t0)+" ms"; this.t0=0; } if (s==="thinking") this.t0 = performance.now();
          $("end").classList.toggle("on", s!=="asleep"); $("tap").style.display = s==="asleep" ? "block":"none"; },
  heard(t){ const h=$("heard"); h.textContent=t; h.style.opacity=1; clearTimeout(this.ht); this.ht=setTimeout(()=>h.style.opacity=0,5000); },
  said(t){ const s=$("said"); s.textContent=t; s.style.opacity=1; clearTimeout(this.st); this.st=setTimeout(()=>s.style.opacity=0,6000); },
  notice(html, ms){ const n=$("notice"); n.innerHTML=html; n.style.display="block"; clearTimeout(this.nt); if(ms) this.nt=setTimeout(()=>n.style.display="none",ms); }
};

// ---------- audio core ----------
let micAnalyser, ctx, micStream, micLevel = 0, outAnalyser, outGain, procNode;
const FRAME = 2048;
let frameMs = 46;

async function initAudio(){
  if (!ctx){
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    outGain = ctx.createGain(); outAnalyser = ctx.createAnalyser(); outAnalyser.fftSize = 256; outAnalyser.smoothingTimeConstant = 0.7;
    outGain.connect(outAnalyser); outAnalyser.connect(ctx.destination);
  }
  if (ctx.state !== "running") await ctx.resume();
  if (!micStream || micStream.getAudioTracks().every(t=>t.readyState==="ended")){
    // One stream for the whole session: never torn down, so the browser has no reason to ask again.
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1}});
    const src = ctx.createMediaStreamSource(micStream);
    procNode = ctx.createScriptProcessor(FRAME, 1, 1);
    const mute = ctx.createGain(); mute.gain.value = 0;
    src.connect(procNode); procNode.connect(mute); micAnalyser = ctx.createAnalyser(); micAnalyser.fftSize = 256; micAnalyser.smoothingTimeConstant = 0.7; src.connect(micAnalyser); mute.connect(ctx.destination);
    frameMs = FRAME / ctx.sampleRate * 1000;
    procNode.onaudioprocess = e => vad.frame(new Float32Array(e.inputBuffer.getChannelData(0)));
  }
}

// ---------- voice activity detection + barge-in ----------
const vad = {
  floor: 0.004, count: 0, rec: null, prefix: [], silence: 0, voiced: 0, pausedFor: null, backchanneled: false,
  frame(buf){
    let s = 0; for (let i=0;i<buf.length;i++) s += buf[i]*buf[i];
    const rms = Math.sqrt(s/buf.length); micLevel = rms;
    if (ui.state === "asleep") return;
    const fridayTalking = player.playing;
    const start = fridayTalking ? Math.max(this.floor*6, 0.04) : Math.max(this.floor*3.2, 0.014);
    if (!this.rec){
      this.prefix.push(buf); if (this.prefix.length > Math.ceil(320/frameMs)) this.prefix.shift();
      if (rms > start) this.count++; else { this.count = Math.max(0, this.count-1); this.floor = Math.min(0.03, Math.max(0.0015, this.floor*0.99 + rms*0.01)); }
      if (this.count*frameMs >= (fridayTalking ? 180 : 140)) this.begin();
    } else {
      this.rec.push(buf);
      const end = Math.max(this.floor*2.2, 0.009);
      if (rms > end){ this.voiced += frameMs; 
        if (this.silence > 220 && this.silence < 600 && this.voiced > 6500 && !this.backchanneled){ this.backchanneled = true; player.backchannel(); }
        this.silence = 0; }
      else this.silence += frameMs;
      const len = this.rec.length*frameMs;
      if (this.silence >= 620 || len > 30000) this.finish();
      // false alarm (a cough, a door): resume Friday where she was
      if (this.pausedFor && len > 900 && this.voiced < 250){ this.rec = null; this.count = 0; player.resume(); this.pausedFor = null; ui.set("speaking"); }
    }
  },
  begin(){
    this.count = 0; this.silence = 0; this.voiced = 0; this.backchanneled = false;
    this.rec = this.prefix.slice(); this.prefix = [];
    if (player.playing || brain.busy){ this.pausedFor = brain.turn; player.pause(); }   // cut within one frame
    lastActivity = Date.now();
    ui.set("listening");
  },
  async finish(){
    const frames = this.rec; this.rec = null;
    const wasPaused = this.pausedFor; this.pausedFor = null;
    if (this.voiced < 280){ if (wasPaused) { player.resume(); ui.set("speaking"); } else ui.set("idle"); return; }
    // real interruption: drop what Friday was going to say
    if (wasPaused){ brain.interrupt(); }
    ui.set("thinking");
    const myTurn = ++brain.turn;
    let text = "";
    try { text = await transcribe(frames); } catch(e){ console.warn(e); }
    if (myTurn !== brain.turn) return;
    if (!isRealSpeech(text)){ if (wasPaused) { /* nothing worth answering */ } ui.set("idle"); return; }
    ui.heard(text);
    brain.respond(text, myTurn);
  }
};

const HALLUCINATIONS = /^(thank you\.?|thanks\.?|thanks for watching!?|you\.?|bye\.?|\.|okay\.?|uh\.?|um\.?|hmm\.?|mm\.?|so\.?|\W*)$/i;
function isRealSpeech(t){ t = (t||"").trim(); return t.length > 1 && !HALLUCINATIONS.test(t); }

function toWav(frames, inRate){
  const outRate = 16000, ratio = inRate/outRate;
  let total = 0; frames.forEach(f=> total += f.length);
  const all = new Float32Array(total); let o = 0; frames.forEach(f=>{ all.set(f,o); o+=f.length; });
  const n = Math.floor(total/ratio), pcm = new Int16Array(n);
  for (let i=0;i<n;i++){ const a = Math.floor(i*ratio), b = Math.min(total, Math.floor((i+1)*ratio)); let s=0; for(let j=a;j<b;j++) s+=all[j]; const v = s/Math.max(1,b-a); pcm[i] = Math.max(-1,Math.min(1,v))*0x7fff; }
  const buf = new ArrayBuffer(44 + pcm.length*2), dv = new DataView(buf);
  const w = (p,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(p+i, s.charCodeAt(i)); };
  w(0,"RIFF"); dv.setUint32(4, 36+pcm.length*2, true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,outRate,true); dv.setUint32(28,outRate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,"data"); dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], {type:"audio/wav"});
}

async function transcribe(frames){
  const fd = new FormData();
  fd.append("file", toWav(frames, ctx.sampleRate), "speech.wav");
  fd.append("model", STT); fd.append("language", "en"); fd.append("temperature", "0"); fd.append("response_format", "json");
  const r = await fetch(API + "/audio/transcriptions", {method:"POST", headers:{Authorization:"Bearer "+cfg.key}, body:fd});
  if (!r.ok) throw new Error("stt " + r.status + " " + (await r.text()));
  return (await r.json()).text.trim();
}

// ---------- speech output ----------
let ttsBroken = false;
const ttsCache = new Map();
async function synth(text, signal){
  if (ttsBroken) return null;
  if (ttsCache.has(text+cfg.voice)) return ttsCache.get(text+cfg.voice);
  const r = await fetch(API + "/audio/speech", {method:"POST", signal, headers:{Authorization:"Bearer "+cfg.key, "Content-Type":"application/json"},
    body: JSON.stringify({model:TTS, voice:cfg.voice, input:text.slice(0,200), response_format:"wav"})});
  if (!r.ok){
    const body = await r.text();
    if (body.includes("terms")){ ttsBroken = true;
      ui.notice('Friday\'s natural voice needs one click: <a href="https://console.groq.com/playground?model=canopylabs%2Forpheus-v1-english" target="_blank">accept the Orpheus terms on Groq</a>, then reload.'); }
    throw new Error("tts " + r.status + " " + body);
  }
  const audio = await ctx.decodeAudioData(await r.arrayBuffer());
  if (text.length < 20) ttsCache.set(text+cfg.voice, audio);
  return audio;
}

const player = {
  queue: [], playing: false, cur: null, curStart: 0, curOffset: 0, paused: null, spokenText: "",
  // items: {promise -> AudioBuffer|null, text}
  enqueue(item){ this.queue.push(item); if (!this.playing && !this.paused) this.next(); },
  async next(){
    if (this.paused) return;
    const item = this.queue.shift();
    if (!item){ this.playing = false; this.cur = null; brain.doneSpeaking(); return; }
    this.playing = true; ui.set("speaking");
    let buf = null; try { buf = await item.promise; } catch(e){ console.warn(e); }
    if (item.turn !== undefined && item.turn !== brain.turn && !item.anyTurn){ return this.next(); }
    if (this.paused){ this.queue.unshift(item); return; }
    ui.said(item.text);
    if (!buf){ await speakFallback(item.text); this.spokenText += item.text + " "; return this.next(); }
    this.play(buf, 0, item);
  },
  play(buf, offset, item){
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(outGain);
    this.cur = {src, buf, item}; this.curStart = ctx.currentTime - offset;
    src.onended = () => { if (this.cur && this.cur.src === src){ this.spokenText += item.text + " "; this.cur = null; this.next(); } };
    src.start(0, offset);
  },
  pause(){
    if (this.cur){ const c = this.cur; this.cur = null; this.paused = {buf:c.buf, item:c.item, offset: ctx.currentTime - this.curStart}; try{ c.src.onended=null; c.src.stop(); }catch(e){} }
    else this.paused = this.paused || {buf:null};
    speechSynthesis && speechSynthesis.cancel();
    this.playing = false;
  },
  resume(){
    const p = this.paused; this.paused = null; if (!p) return;
    if (p.buf){ this.playing = true; this.play(p.buf, Math.max(0, p.offset-0.25), p.item); }
    else if (this.queue.length){ this.next(); } else { this.playing = false; brain.doneSpeaking(); }
  },
  stopAll(){ this.queue = []; this.paused = null; if (this.cur){ try{ this.cur.src.onended=null; this.cur.src.stop(); }catch(e){} } this.cur = null; this.playing = false; speechSynthesis && speechSynthesis.cancel(); },
  // whatever Friday actually got out loud before being cut off
  takeSpoken(){ let t = this.spokenText; if (this.paused && this.paused.item && this.paused.buf){ const frac = this.paused.offset / this.paused.buf.duration; const words = this.paused.item.text.split(" "); t += words.slice(0, Math.round(words.length*frac)).join(" "); } this.spokenText = ""; return t.trim(); },
  async backchannel(){
    try{ const b = await synth(["Mm-hm.","Right.","Mm-hm."][Math.floor(Math.random()*3)]); if(!b || player.playing) return;
      const s = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = 0.55; s.buffer = b; s.connect(g); g.connect(outGain); s.start(); }catch(e){}
  }
};
function speakFallback(text){ return new Promise(res => setTimeout(res, Math.min(9000, 600 + text.length*55))); }

// ---------- the brain ----------
function systemPrompt(){
  const now = new Date();
  return `You are FRIDAY, ${cfg.name || "the user"}'s personal AI, in the spirit of Tony Stark's assistant: quick, warm, quietly witty, unflappable and loyal. You're talking out loud on a live voice call, not writing.

How you talk:
- 1 to 3 short sentences, like a real person on the phone. Never paragraphs, never lists, never markdown, emojis, URLs, or citation marks; everything you write is spoken aloud.
- Contractions and natural phrasing ("yeah", "okay so", "hmm, let me think", "honestly"). A little dry humor when it fits. Vary how you start sentences.
- Say numbers, times, and units the way people say them ("about sixty degrees", "quarter past six").
- If something is ambiguous, ask one short question instead of guessing.
- You remember the whole conversation. Refer back naturally and never re-ask what you already know.
- If a message says you were cut off, don't repeat or finish the old thought. Answer the new thing.
- If he just thinks out loud or says something small, react like a friend would, briefly. Not every turn needs a question back.
- For anything current or factual you're not sure of (news, weather, scores, prices, hours, people, events), use browser_search, then just say the answer in a sentence. Never say "according to my search".
- Use save_note, list_notes, set_reminder and list_reminders when he asks to remember, note, or be reminded of something. Confirm in a few words.
- He is a pastor; be respectful of faith and comfortable talking scripture, sermons and ministry.

Right now it is ${now.toLocaleString("en-US",{weekday:"long", month:"long", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit"})} (${Intl.DateTimeFormat().resolvedOptions().timeZone}). He's usually around Harrisburg, Pennsylvania.`;
}

const TOOLS = [
  {type:"browser_search"},
  {type:"function", function:{name:"save_note", description:"Save a note for the user.", parameters:{type:"object", properties:{text:{type:"string"}}, required:["text"]}}},
  {type:"function", function:{name:"list_notes", description:"Read back the user's saved notes.", parameters:{type:"object", properties:{}}}},
  {type:"function", function:{name:"set_reminder", description:"Set a reminder. Give either minutes_from_now or an ISO local datetime.", parameters:{type:"object", properties:{text:{type:"string"}, minutes_from_now:{type:"number"}, at_iso:{type:"string", description:"Local time, e.g. 2026-10-18T18:00"}}, required:["text"]}}},
  {type:"function", function:{name:"list_reminders", description:"List upcoming reminders.", parameters:{type:"object", properties:{}}}}
];

function runTool(name, args){
  if (name === "save_note"){ notes.push({text:args.text, at:new Date().toISOString()}); store.set("notes", notes); return {ok:true, count:notes.length}; }
  if (name === "list_notes"){ return {notes: notes.slice(-15).map(n=>n.text)}; }
  if (name === "set_reminder"){
    let at = args.minutes_from_now ? Date.now() + args.minutes_from_now*60000 : Date.parse(args.at_iso || "");
    if (!at || isNaN(at)) return {ok:false, error:"Need a time"};
    const r = {id: Date.now(), at, text: args.text, done:false}; reminders.push(r); store.set("reminders", reminders);
    if (window.Notification && Notification.permission === "default") Notification.requestPermission();
    return {ok:true, when: new Date(at).toLocaleString()};
  }
  if (name === "list_reminders"){ return {reminders: reminders.filter(r=>!r.done && r.at > Date.now()).map(r=>({text:r.text, when:new Date(r.at).toLocaleString()}))}; }
  return {error:"unknown tool"};
}
setInterval(()=>{
  const due = reminders.filter(r=>!r.done && r.at <= Date.now());
  due.forEach(r=>{ r.done = true;
    if (window.Notification && Notification.permission === "granted") new Notification("Friday", {body:r.text, icon:"icon-192.png"});
    if (ui.state !== "asleep" && !vad.rec) brain.say("Hey, reminder: " + r.text, true);
  });
  if (due.length) store.set("reminders", reminders);
}, 15000);

function clean(t){
  return t.replace(/【[^】]*】/g,"").replace(/\[\d+\]/g,"").replace(/https?:\/\/\S+/g,"").replace(/[*_#`>|]/g,"")
          .replace(/°\s?F/g," degrees").replace(/°\s?C/g," degrees Celsius").replace(/°/g," degrees")
          .replace(/\u202f|\u00a0/g," ").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").replace(/\s+/g," ");
}

const brain = {
  turn: 0, busy: false, ctrl: null, filler: null,
  interrupt(){
    const said = player.takeSpoken();
    player.stopAll(); if (this.ctrl) this.ctrl.abort(); this.ctrl = null; clearTimeout(this.filler);
    const last = history[history.length-1];
    if (this.busy || said){
      if (last && last.role === "assistant") last.content = (said || last.content.slice(0,60)) + " — [you were cut off here]";
      else if (said) history.push({role:"assistant", content: said + " — [you were cut off here]"});
    }
    this.busy = false; saveHistory();
  },
  doneSpeaking(){ if (!this.busy && !vad.rec) ui.set("idle"); },
  say(text, anyTurn){ const t = this.turn; player.enqueue({promise: synth(text), text, turn:t, anyTurn}); },
  async respond(userText, turn){
    this.busy = true; player.spokenText = "";
    history.push({role:"user", content:userText}); saveHistory();
    this.ctrl = new AbortController();
    const signal = this.ctrl.signal;
    let gotAudio = false;
    this.filler = setTimeout(()=>{ if (turn===this.turn && !gotAudio){ const f = ["One sec.","Let me check.","Hmm, give me a second."][Math.floor(Math.random()*3)]; player.enqueue({promise:synth(f), text:f, turn}); } }, 1400);
    const msgs = [{role:"system", content:systemPrompt()}, ...history.slice(-24)];
    let full = "";
    try {
      for (let hop=0; hop<3; hop++){
        const res = await this.stream(msgs, signal, sentence => { gotAudio = true; clearTimeout(this.filler); full += sentence + " "; player.enqueue({promise: synth(sentence, signal).catch(e=>{ if(!ttsBroken) console.warn(e); return null; }), text:sentence, turn}); });
        if (turn !== this.turn) return;
        if (!res.toolCalls.length) break;
        msgs.push({role:"assistant", content: res.text || null, tool_calls: res.toolCalls});
        for (const tc of res.toolCalls){ let a={}; try{ a = JSON.parse(tc.function.arguments||"{}"); }catch(e){}
          msgs.push({role:"tool", tool_call_id: tc.id, content: JSON.stringify(runTool(tc.function.name, a))}); }
      }
    } catch(e){
      if (e.name === "AbortError" || turn !== this.turn) return;
      console.warn(e);
      const m = String(e.message||"");
      const line = m.includes("401") ? "Hmm, my Groq key isn't working. Long-press me to fix it." : m.includes("429") ? "I'm getting rate limited for a moment. Try me again in a few seconds." : "Sorry, I lost the connection for a second. Say that again?";
      full = line; player.enqueue({promise:synth(line), text:line, turn});
    }
    clearTimeout(this.filler);
    if (turn !== this.turn) return;
    history.push({role:"assistant", content: full.trim() || "…"}); saveHistory();
    this.busy = false; this.ctrl = null;
    if (!player.playing && !player.queue.length) ui.set("idle");
  },
  async stream(messages, signal, onSentence){
    const r = await fetch(API + "/chat/completions", {method:"POST", signal, headers:{Authorization:"Bearer "+cfg.key, "Content-Type":"application/json"},
      body: JSON.stringify({model:LLM, messages, tools:TOOLS, reasoning_effort:"low", temperature:0.8, max_completion_tokens:700, stream:true})});
    if (!r.ok) throw new Error("llm " + r.status + " " + (await r.text()).slice(0,200));
    const reader = r.body.getReader(), dec = new TextDecoder();
    let raw = "", pending = "", text = ""; const calls = {};
    const flush = (force) => {
      pending = clean(pending);
      for (;;){
        const m = pending.match(/^(.{8,}?[.!?…])(\s+|$)/) || (pending.length > 170 && pending.match(/^(.{60,170}?[,;:—])\s+/));
        if (!m) break;
        if (!force && m[2] === "" ) break;
        const s = m[1].trim(); pending = pending.slice(m[0].length); if (s) onSentence(s);
      }
      if (force && pending.trim()){ let rest = pending.trim(); while (rest.length > 190){ const cut = rest.lastIndexOf(" ", 190); onSentence(rest.slice(0,cut)); rest = rest.slice(cut+1); } onSentence(rest); pending = ""; }
    };
    for (;;){
      const {done, value} = await reader.read(); if (done) break;
      raw += dec.decode(value, {stream:true});
      let i; while ((i = raw.indexOf("\n")) >= 0){
        const line = raw.slice(0,i).trim(); raw = raw.slice(i+1);
        if (!line.startsWith("data:")) continue; const data = line.slice(5).trim(); if (data === "[DONE]") continue;
        let j; try{ j = JSON.parse(data); }catch(e){ continue; }
        const d = j.choices && j.choices[0] && j.choices[0].delta; if (!d) continue;
        if (d.content){ text += d.content; pending += d.content; flush(false); }
        if (d.tool_calls) d.tool_calls.forEach(tc => { const c = calls[tc.index||0] || (calls[tc.index||0] = {id:"", type:"function", function:{name:"", arguments:""}});
          if (tc.id) c.id = tc.id; if (tc.function && tc.function.name) c.function.name += tc.function.name; if (tc.function && tc.function.arguments) c.function.arguments += tc.function.arguments; });
      }
    }
    flush(true);
    return {text, toolCalls: Object.values(calls).filter(c=>c.function.name)};
  }
};

// ---------- session ----------
let lastActivity = Date.now();
setInterval(()=>{ if (ui.state !== "asleep" && Date.now()-lastActivity > 15*60000 && !player.playing) sleep(); }, 30000);

function greeting(){
  const h = new Date().getHours(), n = cfg.name ? ", " + cfg.name : "";
  const opts = h < 12 ? [`Morning${n}. What are we getting into?`, `Good morning${n}. I'm here.`] : h < 18 ? [`Hey${n}. What's up?`, `Afternoon${n}. What do you need?`] : [`Evening${n}. What's on your mind?`, `Hey${n}. I'm listening.`];
  return opts[Math.floor(Math.random()*opts.length)];
}
let greetedThisLoad = false;
async function wake(){
  if (!cfg.key){ openSetup(); return; }
  try { await initAudio(); }
  catch(e){ ui.notice("I need the microphone. Allow it for this site (on iPhone: Settings, Safari, Microphone, Allow) and tap again.", 9000); return; }
  lastActivity = Date.now();
  ui.set("idle");
  if (!greetedThisLoad){ greetedThisLoad = true; brain.say(greeting()); }
  ["Mm-hm.","Right.","One sec.","Let me check.","Hmm, give me a second."].forEach(t=>synth(t).catch(()=>{}));
}
function sleep(){ brain.turn++; brain.interrupt(); vad.rec = null; ui.set("asleep"); ui.said(""); }
function hudTick(){ const d=new Date(); $("h-clock").textContent=d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}); $("h-date").textContent=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"2-digit"}); $("h-voice").textContent=(cfg.voice||"--")+(ttsBroken?" ⚠":""); $("h-mem").textContent=history.length; $("h-notes").textContent=notes.length; $("h-link").textContent= ui.state==="asleep"?"Standby":"Online"; } setInterval(hudTick,1000); hudTick();

// tap to wake, end circle to sleep, long-press for settings
let pressT = null, longPressed = false;
document.addEventListener("pointerdown", e => { if (e.target.closest(".sheet") || e.target.id==="end") return; longPressed = false; pressT = setTimeout(()=>{ longPressed = true; openSetup(); }, 650); });
document.addEventListener("pointerup", e => { clearTimeout(pressT); if (e.target.closest(".sheet") || e.target.id==="end" || longPressed) return; if (ui.state === "asleep") wake(); });
$("end").addEventListener("click", e => { e.stopPropagation(); sleep(); });

function openSetup(){
  $("f-name").value = cfg.name || ""; $("f-key").value = cfg.key || ""; $("f-voice").value = cfg.voice || "diana";
  $("f-extra").style.display = cfg.key ? "flex" : "none";
  $("setup").classList.add("on");
}
$("f-save").onclick = () => { cfg = {name:$("f-name").value.trim(), key:$("f-key").value.trim(), voice:$("f-voice").value}; store.set("cfg", cfg); ttsCache.clear(); ttsBroken = false; $("setup").classList.remove("on"); if (ui.state==="asleep") wake(); };
$("f-close").onclick = () => $("setup").classList.remove("on");
$("f-forget").onclick = () => { history = []; saveHistory(); $("f-forget").textContent = "Cleared"; setTimeout(()=>$("f-forget").textContent="Clear memory",1500); };
$("f-preview").onclick = async () => {
  const old = cfg; cfg = {...cfg, key:$("f-key").value.trim(), voice:$("f-voice").value};
  try { await initAudio(); ttsBroken = false; const b = await synth("Hey, it's Friday. This is how I'll sound."); if (b){ const s = ctx.createBufferSource(); s.buffer = b; s.connect(outGain); s.start(); } }
  catch(e){ if (!ttsBroken) ui.notice("Couldn't reach Groq with that key.", 5000); }
  cfg = old.key ? old : cfg;
};

// ---------- the HUD reactor ----------
const cv = $("orb"), g = cv.getContext("2d");
let W, H, dpr; function size(){ dpr = Math.min(2, devicePixelRatio||1); W = cv.width = innerWidth*dpr; H = cv.height = innerHeight*dpr; } size(); addEventListener("resize", size);
const fbin = new Uint8Array(128), tbin = new Uint8Array(256);
let smooth = 0, spin = 0, power = 0, t0 = performance.now(), lastT = t0;
const parts = Array.from({length:70}, () => ({a:Math.random()*6.283, r:1.6+Math.random()*1.6, s:(Math.random()-.5)*0.15, z:Math.random()}));
function arc(cx,cy,r,a0,a1,w,col){ g.beginPath(); g.arc(cx,cy,r,a0,a1); g.lineWidth=w; g.strokeStyle=col; g.stroke(); }
function draw(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT = now; const t = (now - t0)/1000;
  const st = ui.state, awake = st !== "asleep";
  power += ((awake?1:0.28) - power) * dt * 2.2;
  let lvl = 0, an = null;
  if (st === "speaking" && outAnalyser) an = outAnalyser; else if ((st === "listening" || st === "idle") && micAnalyser) an = micAnalyser;
  if (an){ an.getByteTimeDomainData(tbin); let s=0; for (let i=0;i<tbin.length;i++){ const v=(tbin[i]-128)/128; s+=v*v; } lvl = Math.min(1, Math.sqrt(s/tbin.length)*(an===micAnalyser?9:5)); an.getByteFrequencyData(fbin); } else fbin.fill(0);
  smooth += (lvl - smooth) * 0.22;
  const speed = st==="thinking" ? 2.6 : st==="speaking" ? 1.2 : st==="listening" ? 0.9 : 0.35;
  spin += dt * speed;
  const hueMain = st==="thinking" ? "180,150,255" : st==="listening" ? "255,190,90" : "95,220,255";
  const C = a => `rgba(${hueMain},${a*power})`, CY = a => `rgba(95,220,255,${a*power})`;
  g.clearRect(0,0,W,H);
  const cx = W/2, cy = H*0.44, R = Math.min(W,H)*0.25;
  g.save(); g.globalCompositeOperation = "lighter";
  // glow core
  let gr = g.createRadialGradient(cx,cy,0,cx,cy,R*1.25);
  gr.addColorStop(0, C(0.55 + smooth*0.4)); gr.addColorStop(0.18, C(0.22 + smooth*0.25)); gr.addColorStop(0.6, C(0.04)); gr.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle = gr; g.beginPath(); g.arc(cx,cy,R*1.25,0,6.283); g.fill();
  // inner core disc + triangle-ish facets
  const core = R*0.2*(1 + smooth*0.35 + 0.03*Math.sin(t*2));
  gr = g.createRadialGradient(cx,cy,0,cx,cy,core); gr.addColorStop(0,`rgba(255,255,255,${0.95*power})`); gr.addColorStop(0.5,C(0.85)); gr.addColorStop(1,C(0.0));
  g.fillStyle = gr; g.beginPath(); g.arc(cx,cy,core,0,6.283); g.fill();
  arc(cx,cy,core*1.25,0,6.283,1.2*dpr,C(0.7));
  for (let i=0;i<3;i++){ const a = -spin*1.5 + i*2.094; arc(cx,cy,core*1.6,a,a+1.6,2.5*dpr,C(0.55)); }
  // frequency spectrum ring
  const fr = R*0.42, n = 72;
  for (let i=0;i<n;i++){
    const a = i/n*6.283 - 1.5708 + spin*0.2; const v = fbin[Math.floor((i<n/2? i : n-i)/(n/2)*48)+2]/255;
    const len = R*0.03 + v*R*0.28*(st==="speaking"?1:0.8) + (awake? 0.006*R*Math.sin(t*3+i):0);
    g.beginPath(); g.moveTo(cx+Math.cos(a)*fr, cy+Math.sin(a)*fr); g.lineTo(cx+Math.cos(a)*(fr+len), cy+Math.sin(a)*(fr+len));
    g.lineWidth = 2.2*dpr; g.strokeStyle = C(0.35 + v*0.6); g.stroke();
  }
  // segmented ring
  const r2 = R*0.78;
  for (let i=0;i<24;i++){ const a = spin*0.5 + i*0.2618; arc(cx,cy,r2,a,a+0.19,4*dpr,CY(i%6===0?0.85:0.32)); }
  // tick ring
  const r3 = R*0.92;
  for (let i=0;i<120;i++){ const a = -spin*0.15 + i*0.05236; const big = i%10===0; const l = big? R*0.05 : R*0.02;
    g.beginPath(); g.moveTo(cx+Math.cos(a)*r3, cy+Math.sin(a)*r3); g.lineTo(cx+Math.cos(a)*(r3+l), cy+Math.sin(a)*(r3+l)); g.lineWidth=(big?1.6:1)*dpr; g.strokeStyle=CY(big?0.6:0.25); g.stroke(); }
  // outer arcs
  arc(cx,cy,R*1.05, spin*0.8, spin*0.8+2.2, 1.5*dpr, C(0.6));
  arc(cx,cy,R*1.05, spin*0.8+3.14, spin*0.8+4.1, 1.5*dpr, C(0.45));
  arc(cx,cy,R*1.12, -spin*0.6, -spin*0.6+0.7, 6*dpr, CY(0.18));
  arc(cx,cy,R*1.12, -spin*0.6+3.4, -spin*0.6+3.7, 6*dpr, CY(0.18));
  arc(cx,cy,R*1.2, 0, 6.283, 0.8*dpr, CY(0.14));
  // thinking scanner
  if (st==="thinking"){ const a = spin*2.4; gr = g.createConicGradient ? g.createConicGradient(a-0.6, cx, cy) : null;
    if (gr){ gr.addColorStop(0,"rgba(0,0,0,0)"); gr.addColorStop(0.09,C(0.35)); gr.addColorStop(0.1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,R*1.2,0,6.283); g.fill(); } }
  // dust particles
  parts.forEach(p => { p.a += p.s*dt*(1+speed); const rr = R*p.r*(1+smooth*0.08); const x = cx+Math.cos(p.a)*rr, y = cy+Math.sin(p.a)*rr*0.98;
    g.fillStyle = CY(0.15+0.35*p.z); g.fillRect(x, y, 1.6*dpr, 1.6*dpr); });
  // crosshair hairlines
  g.strokeStyle = CY(0.08); g.lineWidth = 1*dpr; g.beginPath(); g.moveTo(cx-R*1.6,cy); g.lineTo(cx-R*1.25,cy); g.moveTo(cx+R*1.25,cy); g.lineTo(cx+R*1.6,cy); g.stroke();
  g.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

if (!cfg.key) openSetup();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
